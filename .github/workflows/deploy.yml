name: Publicar FinanceFlow no Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: financeflow-cloudflare-production
  cancel-in-progress: true
jobs:
  publicar:
    name: Validar e publicar no Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Baixar versão mais recente
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar testes e sintaxe antes de publicar
        run: |
          node --test tests/*.test.mjs
          node --check src/categorizer.mjs
          node --check src/chart.mjs
          node --check src/core.mjs
          node --check src/app.mjs
      - name: Garantir correspondência dos arquivos publicados
        run: |
          cmp index.html public/index.html
          cmp styles.css public/styles.css
          cmp dashboard-v4.css public/dashboard-v4.css
          cmp assets/goal-mountain.svg public/assets/goal-mountain.svg
          cmp src/app.mjs public/src/app.mjs
          cmp src/core.mjs public/src/core.mjs
          cmp src/categorizer.mjs public/src/categorizer.mjs
          cmp src/chart.mjs public/src/chart.mjs
          grep -q 'financeflow-reference-v4' public/index.html
          grep -q 'settlement-apply' public/index.html
          grep -q 'bottom-main' public/index.html
          grep -q 'dashboard-v4.css' public/index.html
      - name: Exigir credenciais de publicação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" ]]; then
            echo '::error::O GitHub testou o código, mas NÃO PUBLICOU. Configure os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Publicar pasta public no Worker existente
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Registrar publicação concluída
        env:
          LIVE_URL: ${{ steps.publish.outputs.deployment-url }}
        shell: bash
        run: |
          echo '### FinanceFlow publicado com sucesso' >> "$GITHUB_STEP_SUMMARY"
          echo 'Layout esperado: Reference V4, dashboard fiel ao print e quitação proporcional na aba Vencimentos.' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$LIVE_URL" ]]; then echo "Endereço: $LIVE_URL" >> "$GITHUB_STEP_SUMMARY"; fi
