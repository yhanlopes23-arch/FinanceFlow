name: Verificar FinanceFlow
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar regras financeiras
        run: node --test tests/*.test.mjs
      - name: Verificar sintaxe do app
        run: |
          node --check src/categorizer.mjs
          node --check src/chart.mjs
          node --check src/core.mjs
          node --check src/app.mjs
